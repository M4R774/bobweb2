name: Main branch quality gate

on:
  push:
    branches: [ main ]

jobs:
  tests_and_sonar:
    name: tests_and_sonar
    runs-on: ubuntu-latest
    steps:
    
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python 3.15
      uses: actions/setup-python@v5
      with:
        python-version: '3.15'
    - uses: actions/cache@v4
      with:
        path: ${{ env.pythonLocation }}
        key: ${{ env.pythonLocation }}-${{ hashFiles('requirements*.txt') }}

    - name: Set up ffmpeg
      uses: FedericoCarboni/setup-ffmpeg@v2

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade --upgrade-strategy eager -r requirements-dev.txt
        
    - name: Test migration script
      run: |
        coverage erase
        coverage run --append -m unittest discover utilities

    - name: Check for migrations
      run: |
        python utilities/check_for_new_migrations.py

    - name: Run unit tests
      env:
        BOT_TOKEN: "DUMMY_TOKEN"
        DJANGO_SECRET_KEY: "DUMMY_SECRET"
      run: |
        python web/manage.py migrate
        coverage run --append -m unittest discover bot
        coverage run --append web/manage.py test --noinput
        coverage xml -i

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
